name: CMYK export contribution validation

on:
  push:
    branches: [validation/oct10-cmyk-export]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  io-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: cmyk-export-checks
          cache-on-failure: true
      - name: Check submitted revision
        run: |
          git checkout --detach 80e4b1e6cc1892703e7b689d51c8a244671c66c9
          cargo fmt --all -- --check
          cargo test -p photocraft-io --locked
          cargo clippy -p photocraft-io --all-targets --locked -- -D warnings
          cargo xtask layers
          cargo xtask wasm
          cargo xtask scorecard --check
      - name: Prove the regression test rejects the old exporter
        run: |
          git show 2b79c7c25dca562b8eb00f4b0a5fc15b5edbc4ff:crates/io/src/flat.rs > crates/io/src/flat.rs
          set +e
          cargo test -p photocraft-io --locked --test color layered_cmyk_flat_tiff_keeps_mode_alpha_depth_and_profile > /tmp/regression.log 2>&1
          result=$?
          set -e
          cat /tmp/regression.log
          test "$result" = 101
          grep -q 'layered_cmyk_flat_tiff_keeps_mode_alpha_depth_and_profile ... FAILED' /tmp/regression.log
          grep -q 'Cmyk composite written as sRGB RGB' /tmp/regression.log
          git restore crates/io/src/flat.rs
          git diff --exit-code
