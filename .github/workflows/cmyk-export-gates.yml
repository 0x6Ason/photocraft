name: CMYK export corpus and performance gates

on:
  push:
    branches: [validation/oct10-cmyk-gates]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

jobs:
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5c1ca8aebe9223f9c1fb9fec825ae8d2713abce6
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: corpus
          cache-on-failure: true
      - uses: actions/cache@v4
        with:
          path: corpus/
          key: corpus-${{ hashFiles('xtask/src/corpus_pins.rs', 'xtask/*.sha256') }}
      - run: cargo xtask test-corpus -p io

  quick-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      XDG_RUNTIME_DIR: /tmp
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5c1ca8aebe9223f9c1fb9fec825ae8d2713abce6
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: cmyk-quick-performance
          cache-on-failure: true
      - name: Install native UI and software Vulkan dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev libvulkan1 mesa-vulkan-drivers
      - run: cargo xtask perf --quick
      - name: Report benchmark summary
        if: always()
        run: cat target/perf/summary.md
